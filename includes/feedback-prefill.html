<script>
// Feedback pre-fill: maps each page to its part/chapter, stamps the footer
// "Feedback" link with those values, and (on the Feedback page) injects them
// into the Tally embed so the two dropdowns arrive pre-selected.
(function () {
  // page filename -> { part, chapter } — values MUST match the Tally dropdown options exactly.
  var MAP = {
    "index.html":                        { part: "General / whole book" },
    "about.html":                        { part: "General / whole book" },
    "howto.html":                        { part: "General / whole book" },
    "chatbot.html":                      { part: "General / whole book" },
    "feedback.html":                     { part: "General / whole book" },
    "introduction.html":                 { part: "General / whole book" },

    "eo_data_landscape.html":            { part: "EO data landscape" },
    "eo_missions.html":                  { part: "EO data landscape", chapter: "EO missions" },
    "accessing_eo_data.html":            { part: "EO data landscape", chapter: "Accessing EO data" },

    "data_selection_preprocessing.html": { part: "Data selection & preprocessing" },
    "data_selection.html":               { part: "Data selection & preprocessing", chapter: "Data selection" },
    "data_preprocessing.html":           { part: "Data selection & preprocessing", chapter: "Data preprocessing" },

    "ml_pipeline.html":                  { part: "ML dataset & training" },
    "ml_ready_dataset.html":             { part: "ML dataset & training", chapter: "Constructing an ML-ready dataset" },
    "model_design_training.html":        { part: "ML dataset & training", chapter: "Model design and training" },

    "uncertainty_quantification.html":   { part: "Uncertainty quantification" },
    "uq_sources.html":                   { part: "Uncertainty quantification", chapter: "Sources of uncertainty" },
    "uq_methods.html":                   { part: "Uncertainty quantification", chapter: "Uncertainty quantification methods" },
    "uq_calibration.html":               { part: "Uncertainty quantification", chapter: "Assessing calibration" },
    "uq_spatial.html":                   { part: "Uncertainty quantification", chapter: "Spatial structure of uncertainty" },
    "uq_operationalizing.html":          { part: "Uncertainty quantification", chapter: "Operationalizing uncertainty" },

    "map_production.html":               { part: "Map production & distribution" },
    "map_generation.html":               { part: "Map production & distribution", chapter: "Map generation" },
    "post_processing.html":              { part: "Map production & distribution", chapter: "Post-processing" },
    "sharing.html":                      { part: "Map production & distribution", chapter: "Sharing" },

    "validation.html":                   { part: "Validation" },
    "validation_general.html":           { part: "Validation", chapter: "Common misconceptions in map validation" },
    "validation_design_based.html":      { part: "Validation", chapter: "Design-based accuracy assessment" },
    "validation_beyond.html":            { part: "Validation", chapter: "Validation beyond probability sampling" },

    "conclusion.html":                   { part: "Conclusion" },
    "conclusion_summary.html":           { part: "Conclusion", chapter: "Conclusion: summary" },
    "conclusion_forward.html":           { part: "Conclusion", chapter: "Conclusion: looking forward" },
    "conclusion_limitations.html":       { part: "Conclusion", chapter: "Conclusion: limitations" },

    "appendix_s1_gaps.html":             { part: "Appendices", chapter: "Sentinel-1 data gaps" },
    "appendix_processing_pathways.html": { part: "Appendices", chapter: "S1/S2 processing across access pathways" },
    "appendix_sar_rtc.html":             { part: "Appendices", chapter: "SAR calibration & terrain correction" },
    "appendix_cloud_masking.html":       { part: "Appendices", chapter: "Cloud masking for Sentinel-2" }
  };

  function currentInfo() {
    var base = (window.location.pathname.split("/").pop() || "index.html");
    if (!base) base = "index.html";
    return MAP[base] || null;
  }

  function qs(info) {
    var p = [];
    if (info && info.part)    p.push("part=" + encodeURIComponent(info.part));
    if (info && info.chapter) p.push("chapter=" + encodeURIComponent(info.chapter));
    return p.join("&");
  }

  function run() {
    var info = currentInfo();

    // 1) Stamp the footer "Feedback" link with the current section.
    var link = document.getElementById("site-feedback-link");
    if (link) {
      var query = qs(info);
      if (query) {
        var href = link.getAttribute("href").split("?")[0];
        link.setAttribute("href", href + "?" + query);
      }
    }

    // 2) On the Feedback page, feed the URL's part/chapter into the Tally embed.
    var iframe = document.getElementById("tally-feedback");
    if (iframe) {
      var url = new URL(window.location.href);
      var parts = [];
      if (url.searchParams.get("part"))    parts.push("part=" + encodeURIComponent(url.searchParams.get("part")));
      if (url.searchParams.get("chapter")) parts.push("chapter=" + encodeURIComponent(url.searchParams.get("chapter")));
      var src = iframe.getAttribute("data-tally-src");
      if (parts.length) src += (src.indexOf("?") > -1 ? "&" : "?") + parts.join("&");
      iframe.setAttribute("data-tally-src", src);

      var s = document.createElement("script");
      s.src = "https://tally.so/widgets/embed.js";
      document.body.appendChild(s);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", run);
  } else {
    run();
  }
})();
</script>
